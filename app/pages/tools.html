<div class="container-box">
  <button
    id="backToMenu"
    style="display: none"
    class="btn btn-outline-primary mb-2 fade-in"
  >
    ⬅️
  </button>
  <div id="toolsMenu" class="fade-in">
    <h5>Select a Tool:</h5>
    <ul id="toolsItem" class="list-group"></ul>
  </div>

  <div id="tools-container" class="fade-in" style="display: none">
    <div id="tools-contents"></div>
  </div>
  <div id="error-container" class="error-notification" role="alert">
    <div id="validationStatus" style="display: none">
      <span id="validationSpinner"></span>
      <span id="validationStatusText"></span>
    </div>
  </div>
</div>
