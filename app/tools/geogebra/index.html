<div class="t-container">
  <div class="t-header">
    <h2>GeoGebra Extractor</h2>
    <button id="t-howToUseBtn" type="button" class="t-help-btn">How to use</button>
  </div>
  <div class="t-card">
    <div class="t-tabs">
      <button id="t-tabExtractBtn" type="button" class="t-tab active">📐 Extract Points</button>
      <button id="t-tabColorBtn" type="button" class="t-tab">🎨 Color Picker</button>
    </div>
  </div>

  <!-- PAGE 1: Extract Points -->
  <div id="t-pageExtract" class="t-page">
    <div class="t-card">
      <label for="t-skippedPoints">Skipped points</label>
      <input id="t-skippedPoints" type="text" value="X,Y,X1,Y1">
    </div>

    <div class="t-card t-outputCard">
      <label for="t-output">Output</label>
      <textarea id="t-output" placeholder="Coordinates will appear here..." readonly></textarea>

      <div class="t-btnRow">
        <button id="t-getData">Get Data</button>
        <button id="t-copyBtn" class="t-secondary">Copy</button>
      </div>
    </div>
  </div>

  <!-- PAGE 2: Color Picker -->
  <div id="t-pageColor" class="t-page hidden">
    <div class="t-card t-center">
      <div id="t-swatch" class="t-swatch"></div>
      <p class="t-hint">Color picker coming soon.</p>
    </div>
  </div>

  <div id="t-status" class="t-status"></div>
</div>
